spring:
  application:
    name: inventory-manager

  # Default profile: H2 in-memory database (zero setup, great for demos)
  datasource:
    url: jdbc:h2:mem:inventorydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: embedded

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

---
# Postgres profile: run with --spring.profiles.active=postgres
# (optionally via docker-compose.yml at the project root)
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/inventorydb}
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USER:inventory}
    password: ${POSTGRES_PASSWORD:inventory}
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: false
  h2:
    console:
      enabled: false
  sql:
    init:
      mode: never
